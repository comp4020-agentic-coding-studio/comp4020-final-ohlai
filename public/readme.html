<!doctype html>
<html lang="en-AU" data-style="mono">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About Spotter</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <style>.readme{max-width:720px;margin:0 auto;padding:32px 16px 64px;line-height:1.6}.readme table{border-collapse:collapse;width:100%;margin:16px 0;font-size:.9rem}.readme th,.readme td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.readme img{max-width:100%}.readme code{font-size:.9em}.readme h1{font-size:1rem;color:var(--muted)}</style>
  </head>
  <body>
    <main class="readme">
      <h1>About</h1>
      @README@
    </main>
  </body>
</html>
