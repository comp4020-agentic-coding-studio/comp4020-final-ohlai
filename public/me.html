<!doctype html>
<html lang="en-AU" data-style="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body data-default-view="mobile" class="client">
<main>
  <div class="topbar"><h1 id="hi">Dashboard</h1></div>
  <div class="stats" id="stats"></div>
  <div id="programs"></div>
  <h2>Last workouts</h2>
  <div id="recent"></div>
  <a href="/workouts" class="btn wide" id="all" hidden>All workouts</a>
  <h2>Your PT</h2>
  <div id="pts"></div>
  <p id="err" class="error" role="alert"></p>
</main>

<script src="/view.js"></script>
<script type="module">
  import { $, el, api, ago, utc, toLogin, live } from "/ui.js";
  import { mountNav } from "/nav.js";
  import { workoutCard } from "/workout-card.js";
  mountNav();

  // Tapping a day starts it, so the client is one tap from logging.
  async function start(p, day) {
    if (p.open !== day) {
      const [data, ok] = await api(`/api/p/${p.client_token}/start`, { day });
      if (!ok) return ($("err").textContent = data.error);
    }
    location.href = `/p/${p.client_token}`;
  }

  async function load() {
    const [data, ok] = await api("/api/me");
    if (!ok) return toLogin();
    if (data.me.role === "pt") return (location.href = "/dash");
    $("hi").textContent = `Hi ${data.me.name}`;
    const weekAgo = Date.now() - 7 * 864e5;
    const week = data.workouts.filter((w) => utc(w.started_at) >= weekAgo);
    $("stats").replaceChildren(...[["This week", week.length], ["Sets this week", week.reduce((s, w) => s + w.sets.length, 0)],
      ["Last", ago(data.workouts[0]?.started_at)]].map(([k, v]) => el("div", {}, el("small", { textContent: k }), el("strong", { textContent: v }))));

    $("programs").replaceChildren(...data.programs.map((p) => {
      const open = p.days.find((d) => d.day === p.open);
      return el("section", {},
        el("h2", { textContent: p.title }),
        el("p", { className: "prog-from" }, `Program from ${p.pt_name}, ${p.days.length} day${p.days.length === 1 ? "" : "s"}. `,
          el("a", { href: `/p/${p.client_token}`, textContent: "See it all" })),
        el("div", { className: "daypicks" }, ...p.days.map((d) =>
          el("button", { type: "button", onclick: () => { start(p, d.day); } },
            el("strong", { textContent: d.day }),
            el("small", { textContent: d === open ? "In progress, tap to carry on" : d.exercises.join(", ") })))));
    }));

    $("recent").replaceChildren(...(data.workouts.length ? data.workouts.slice(0, 3).map(workoutCard)
      : [el("p", { className: "muted", textContent: "No workouts yet. Tap a day above to start one." })]));
    $("all").hidden = data.workouts.length <= 3;

    $("pts").replaceChildren(...(data.pts.length ? data.pts.map((pt) => el("div", { className: "card" },
      el("strong", { textContent: pt.name }),
      el("div", { className: "actions" },
        el("a", { href: `/chat/${pt.id}`, className: "btn" }, "Message", pt.unread ? el("span", { className: "badge", textContent: ` ${pt.unread} new` }) : null),
        el("a", { href: `/checkin/${pt.id}`, className: "btn primary", textContent: "Weekly check-in" })),
      el("p", { className: "muted", textContent: pt.checked_in ? `Last check-in ${ago(pt.checked_in).toLowerCase()}.` : "You haven't checked in yet." })))
      : [el("p", { className: "muted", textContent: "Your PT hasn't set up their account yet, so there's no one to message." })]));
  }
  load();
  live("/api/events", load);
</script>
</body>
</html>
