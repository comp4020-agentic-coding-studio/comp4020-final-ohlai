<!doctype html>
<html lang="en-AU" data-style="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programs</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body data-default-view="desktop" class="app">
<main>
  <header class="apphead">
    <div><p class="eyebrow">Your library</p><h1>Programs</h1></div>
    <a href="/programs/new" class="btn primary">New program</a>
  </header>
  <p class="muted">Write a program once, then give it to clients with Onboard client on your
    <a href="/dash">dashboard</a>. Each client gets their own copy, so editing a program here changes it for clients
    you onboard next, never for anyone who already has it.</p>
  <div id="list" class="tgrid"></div>
  <p id="err" class="error" role="alert"></p>
</main>

<script src="/view.js"></script>
<script type="module">
  import { $, el, api, fmtDay, utc, toLogin, ask } from "/ui.js";
  import { mountSide } from "/side.js";
  mountSide();

  async function load() {
    const [data, ok] = await api("/api/templates");
    if (!ok) return toLogin();
    $("list").replaceChildren(...(data.templates.length ? data.templates.map(card) : [
      el("section", { className: "panel empty" },
        el("h2", { textContent: "No programs yet" }),
        el("p", { className: "muted", textContent: "Write a program once, then onboard clients to it from your dashboard." }),
        el("a", { href: "/programs/new", className: "btn primary", textContent: "New program" }))]));
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView({ block: "center" });
  }

  function card(t) {
    const days = [...new Set(t.exercises.map((e) => e.day))];
    return el("section", { className: "panel tcard", id: `p${t.id}` },
      el("h2", { className: "tname", textContent: t.name }),
      el("small", { className: "muted", textContent: `${days.length} day${days.length > 1 ? "s" : ""} · ${t.exercises.length} exercises · saved ${fmtDay(utc(t.created_at))}` }),
      ...days.map((d) => el("div", { className: "tday" },
        el("h4", { textContent: d }),
        el("ul", { className: "plain" }, ...t.exercises.filter((e) => e.day === d).map((e) =>
          el("li", {}, el("span", { textContent: e.name }), el("span", { className: "muted num", textContent: ` ${e.sets} × ${e.reps}` })))))),
      el("div", { className: "actions" },
        el("a", { href: `/programs/new?edit=${t.id}`, className: "btn primary", textContent: "Edit" }),
        el("button", { type: "button", textContent: "Duplicate", onclick: async () => {
          const [data, ok] = await api(`/api/templates/${t.id}/duplicate`, {});
          $("err").textContent = ok ? "" : data.error;
          if (ok) { history.replaceState(null, "", `#p${data.id}`); load(); }
        } }),
        el("button", { type: "button", textContent: "Delete", onclick: async () => {
          if (!(await ask(`Delete ${t.name}?`, "Clients who already have it keep their copy.", "Delete"))) return;
          const [data, ok] = await api(`/api/templates/${t.id}/delete`, {});
          $("err").textContent = ok ? "" : data.error;
          if (ok) load();
        } })));
  }

  load();
</script>
</body>
</html>
