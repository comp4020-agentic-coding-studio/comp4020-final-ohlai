<!doctype html>
<html lang="en-AU" data-style="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Write a program</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-default-view="desktop" class="app">
<main>
  <header class="apphead">
    <div><p class="eyebrow">New program</p><h1>Write a program</h1></div>
    <label class="sr" for="tpl">Start from a template</label>
    <select id="tpl" class="tpl-pick"><option value="">Start from a template…</option></select>
  </header>

  <form id="f" class="builder">
    <section class="panel" id="editName" hidden>
      <div class="panel-head"><h2>Template</h2></div>
      <label for="editTplName">Template name</label>
      <input id="editTplName" maxlength="80" />
    </section>

    <section class="panel" id="clientPanel">
      <div class="panel-head"><h2>Client</h2></div>
      <div class="row">
        <div><label for="title">Program name</label><input id="title" required placeholder="e.g. 4-week strength block" /></div>
        <div><label for="client">Client name</label><input id="client" required /></div>
        <div><label for="email">Client email</label><input id="email" type="email" required /></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Exercises</h2>
        <button type="button" id="add" class="small">+ Add exercise</button>
      </div>
      <div id="list"></div>
    </section>

    <div class="builder-foot" id="editFoot" hidden>
      <p id="editErr" class="error" role="alert"></p>
      <a href="/templates" class="btn">Cancel</a>
      <button type="button" id="saveEdit" class="primary">Save changes</button>
    </div>

    <div class="builder-foot" id="createFoot">
      <p id="err" class="error" role="alert"></p>
      <span id="saved" class="muted" role="status"></span>
      <label class="sr" for="tplName">Template name</label>
      <input id="tplName" placeholder="Template name" maxlength="80" />
      <button type="button" id="saveTpl">Save as template</button>
      <button class="primary" type="submit">Create program</button>
    </div>
  </form>

  <section id="done" class="panel" hidden>
    <h2>Program created</h2>
    <p>Your client's link:</p>
    <p class="share"><a id="clientLink"></a></p>
    <div class="actions">
      <a id="mail" class="btn primary">Email it to them</a>
      <a id="ptLink" class="btn">Open the program</a>
      <a href="/dash" class="btn">Back to dashboard</a>
    </div>
    <p class="muted">It's on your dashboard now. When they open the link they can set a password, and then you can message each other.</p>
  </section>
</main>

<template id="exTpl">
  <div class="card ex">
    <div class="row">
      <div class="narrow"><label>Day</label><input name="day" value="Day 1" /></div>
      <div><label>Exercise</label><input name="name" placeholder="Back squat" /></div>
    </div>
    <div class="row">
      <div><label>Sets</label><input name="sets" type="number" min="1" max="20" value="3" /></div>
      <div><label>Reps</label><input name="reps" value="8-10" /></div>
      <div><label>Rest (s)</label><input name="rest" type="number" min="0" max="600" step="15" value="90" /></div>
      <div class="narrow"><label>&nbsp;</label><button type="button" class="rm" aria-label="Remove exercise">✕</button></div>
    </div>
    <label>Notes</label><input name="notes" placeholder="Tempo, rest, cues" />
  </div>
</template>

<script src="/view.js"></script>
<script type="module">
  import { $, el, api, toLogin } from "/ui.js";
  import { mountSide } from "/side.js";
  const [who, loggedIn] = await api("/api/me");
  if (!loggedIn || who.me.role !== "pt") toLogin();
  mountSide();
  const list = $("list");
  const tpl = $("exTpl");
  function addEx(values) {
    const node = tpl.content.cloneNode(true);
    const last = list.querySelector(".ex:last-child [name=day]");
    if (last) node.querySelector("[name=day]").value = last.value;
    for (const [k, v] of Object.entries(values ?? {})) {
      const input = node.querySelector(`[name=${k}]`);
      if (input) input.value = v;
    }
    node.querySelector(".rm").onclick = (e) => e.target.closest(".ex").remove();
    list.append(node);
  }
  $("add").onclick = () => addEx();
  const exercises = () => [...list.querySelectorAll(".ex")].map((el) =>
    Object.fromEntries([...el.querySelectorAll("input")].map((i) => [i.name, i.value])));

  // Templates: picking one copies its exercises in. The program is its own copy
  // from then on, so editing the template later never changes it.
  const [{ templates = [] }] = await api("/api/templates");
  $("tpl").append(...templates.map((t) => el("option", { value: t.id, textContent: `${t.name} (${t.exercises.length} exercises)` })));
  $("tpl").hidden = !templates.length;
  const start = new URLSearchParams(location.search).get("template");
  function useTemplate(id) {
    const t = templates.find((x) => String(x.id) === String(id));
    if (!t) return;
    if (exercises().some((e) => e.name) && !confirm(`Replace the exercises with "${t.name}"?`)) return ($("tpl").value = "");
    list.replaceChildren();
    for (const e of t.exercises) addEx(e);
    if (!$("title").value) $("title").value = t.name;
  }
  $("tpl").onchange = (e) => useTemplate(e.target.value);
  // Editing a template uses the same builder, minus the client and with Save.
  const editing = templates.find((t) => String(t.id) === new URLSearchParams(location.search).get("edit"));
  if (editing) {
    document.title = `Edit ${editing.name}`;
    document.querySelector(".apphead .eyebrow").textContent = "Template";
    document.querySelector(".apphead h1").textContent = `Edit ${editing.name}`;
    $("tpl").hidden = true;
    $("clientPanel").remove(); // a template has no client
    for (const a of document.querySelectorAll(".side li a")) a.ariaCurrent = a.pathname === "/templates" ? "page" : null;
    $("createFoot").hidden = true;
    $("editName").hidden = $("editFoot").hidden = false;
    $("editTplName").value = editing.name;
    for (const e of editing.exercises) addEx(e);
    $("saveEdit").onclick = async () => {
      const [data, ok] = await api(`/api/templates/${editing.id}`, { name: $("editTplName").value, exercises: exercises() });
      if (!ok) return ($("editErr").textContent = data.error);
      location.href = "/templates";
    };
  } else if (start) ($("tpl").value = start), useTemplate(start);
  else addEx();

  $("saveTpl").onclick = async () => {
    const name = $("tplName").value.trim() || $("title").value.trim();
    const [data, ok] = await api("/api/templates", { name, exercises: exercises() });
    $("err").textContent = ok ? "" : data.error;
    $("saved").textContent = ok ? `Saved "${name}" to your templates.` : "";
    if (ok) $("tplName").value = "";
  };

  $("f").onsubmit = async (e) => {
    e.preventDefault();
    const v = (id) => $(id).value;
    const [data, ok] = await api("/api/programs", { title: v("title"), client_name: v("client"), client_email: v("email"), exercises: exercises() });
    if (!ok) return ($("err").textContent = data.error);

    const clientUrl = `${location.origin}/p/${data.clientToken}`;
    const a = $("clientLink");
    a.href = a.textContent = clientUrl;
    $("ptLink").href = `/p/${data.ptToken}`;
    const body = `Hi ${v("client")},\n\nHere's your program "${v("title")}". Open it on your phone at the gym and log each set as you go:\n\n${clientUrl}\n\n${who.me.name}`;
    $("mail").href =
      `mailto:${encodeURIComponent(v("email"))}?subject=${encodeURIComponent("Your program: " + v("title"))}&body=${encodeURIComponent(body)}`;
    e.target.hidden = true;
    $("done").hidden = false;
  };
</script>
</body>
</html>
