<!doctype html>
<html lang="en-AU" data-style="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New program</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-default-view="desktop" class="app">
<main>
  <header class="apphead">
    <div><p class="eyebrow" id="eyebrow">Programs</p><h1 id="heading">New program</h1></div>
  </header>

  <!-- A program is written once, with no client, then assigned from Programs. -->
  <form id="f" class="builder">
    <section class="panel">
      <label for="name" class="first">Program name</label>
      <input id="name" required maxlength="80" placeholder="e.g. Push / pull / legs" />
    </section>

    <div id="days" class="days"></div>
    <button type="button" id="addDay" class="add-day">+ Add a day</button>

    <div class="builder-foot">
      <p id="err" class="error" role="alert"></p>
      <a href="/programs" class="btn">Cancel</a>
      <button class="primary" type="submit" id="save">Save program</button>
    </div>
  </form>
</main>

<template id="dayTpl">
  <section class="panel day">
    <div class="day-head">
      <label class="sr">Day name</label>
      <input name="day" class="day-name" maxlength="60" aria-label="Day name" />
      <button type="button" class="small rmday">Remove day</button>
    </div>
    <div class="ex-head" aria-hidden="true">
      <span>Exercise</span><span>Sets</span><span>Reps</span><span>Rest (s)</span><span>Notes</span><span></span>
    </div>
    <ol class="exlist"></ol>
    <button type="button" class="small addex">+ Add exercise</button>
  </section>
</template>

<template id="exTpl">
  <li class="exrow">
    <input name="name" aria-label="Exercise" placeholder="Back squat" maxlength="200" />
    <input name="sets" aria-label="Sets" type="number" min="1" max="20" value="3" />
    <input name="reps" aria-label="Reps" value="8-10" maxlength="20" />
    <input name="rest" aria-label="Rest in seconds" type="number" min="0" max="600" step="15" value="90" />
    <input name="notes" aria-label="Notes" placeholder="Tempo, cues" maxlength="500" />
    <button type="button" class="rm" aria-label="Remove exercise">✕</button>
  </li>
</template>

<script src="/view.js"></script>
<script type="module">
  import { $, api, toLogin } from "/ui.js";
  import { mountSide } from "/side.js";
  const [who, loggedIn] = await api("/api/me");
  if (!loggedIn || who.me.role !== "pt") toLogin();
  mountSide();
  for (const a of document.querySelectorAll(".side li a")) a.ariaCurrent = a.pathname === "/programs" ? "page" : null;

  // Days hold their exercises, so the day is typed once, not on every row.
  function addEx(day, values = {}) {
    const node = $("exTpl").content.cloneNode(true);
    for (const [k, v] of Object.entries(values)) {
      const input = node.querySelector(`[name=${k}]`);
      if (input) input.value = v;
    }
    const li = node.querySelector("li");
    node.querySelector(".rm").onclick = () => li.remove();
    day.querySelector(".exlist").append(node);
    return li;
  }
  function addDay(name, exercises = []) {
    const node = $("dayTpl").content.cloneNode(true);
    const day = node.querySelector(".day");
    day.querySelector(".day-name").value = name ?? `Day ${$("days").children.length + 1}`;
    day.querySelector(".rmday").onclick = () => day.remove();
    day.querySelector(".addex").onclick = () => addEx(day).querySelector("input").focus();
    $("days").append(node);
    for (const e of exercises) addEx(day, e);
    if (!exercises.length) addEx(day);
    return day;
  }
  $("addDay").onclick = () => addDay().querySelector(".day-name").select();

  // Flattened back to one list with a day on each exercise, which is how the
  // server stores a program.
  const exercises = () => [...$("days").children].flatMap((day) => {
    const name = day.querySelector(".day-name").value.trim() || "Day";
    return [...day.querySelectorAll(".exrow")].map((row) => ({
      day: name, ...Object.fromEntries([...row.querySelectorAll("input")].map((i) => [i.name, i.value])),
    }));
  });

  // /programs/new?edit=<id> opens a saved program in the same builder.
  const editId = new URLSearchParams(location.search).get("edit");
  const editing = editId && (await api("/api/templates"))[0].templates?.find((t) => String(t.id) === editId);
  if (editing) {
    document.title = `Edit ${editing.name}`;
    $("heading").textContent = `Edit ${editing.name}`;
    $("save").textContent = "Save changes";
    $("name").value = editing.name;
    const days = [...new Set(editing.exercises.map((e) => e.day))];
    for (const d of days) addDay(d, editing.exercises.filter((e) => e.day === d));
  } else addDay("Day 1");

  $("f").onsubmit = async (e) => {
    e.preventDefault();
    const body = { name: $("name").value, exercises: exercises() };
    const [data, ok] = await api(editing ? `/api/templates/${editing.id}` : "/api/templates", body);
    if (!ok) return ($("err").textContent = data.error);
    location.href = `/programs#p${editing?.id ?? data.id}`;
  };
</script>
</body>
</html>
