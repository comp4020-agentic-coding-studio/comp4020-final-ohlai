<!doctype html>
<html lang="en-AU" data-style="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-default-view="mobile" class="chatpage">
<main>
  <div class="topbar">
    <a class="back btn" id="back" href="/" aria-label="Back">←</a>
    <h1 id="title">Messages</h1>
    <span class="toggles"><button type="button" class="view-toggle"></button></span>
  </div>
  <div id="chat"></div>
</main>

<script src="/view.js"></script>
<script type="module">
  import { $, toLogin, live } from "/ui.js";
  import { mountChat } from "/chat.js";

  const chat = mountChat($("chat"), location.pathname.split("/").pop(), {
    onLoad(data, error) {
      if (!data) return error === "No conversation with that person." ? ($("title").textContent = error) : toLogin();
      if (data.me.role === "pt") window.setDefaultView?.("desktop");
      $("back").href = data.me.role === "pt" ? "/dash" : "/me";
      $("title").textContent = data.other.name;
      document.title = `Messages with ${data.other.name}`;
    },
  });
  chat.load();
  live("/api/events", (e) => e.type === "chat" && chat.load());
</script>
</body>
</html>
