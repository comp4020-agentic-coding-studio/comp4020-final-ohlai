<!doctype html>
<html lang="en-AU" data-style="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body data-default-view="mobile" class="client">
<main>
  <div class="topbar"><h1>Settings</h1></div>
  <p class="sub" id="who"></p>

  <h2>Appearance</h2>
  <div class="seg" role="group" aria-label="Colour theme" id="theme">
    <button type="button" data-t="system">System</button>
    <button type="button" data-t="light">Light</button>
    <button type="button" data-t="dark">Dark</button>
  </div>

  <h2>Privacy</h2>
  <div class="card notice">
    <label><input type="checkbox" id="showTraining" checked /> Show my PT when I'm training</label>
    <p class="muted">Your PT sees "Training now" while a workout is open, so they know you might message with a
      question. Turn this off and they see that you've hidden it, instead of "Training now".</p>
  </div>

  <h2>Account</h2>
  <button type="button" id="logout" class="wide">Log out</button>
</main>

<script src="/view.js"></script>
<script type="module">
  import { $, api, logout, toLogin } from "/ui.js";
  import { mountNav } from "/nav.js";
  mountNav();
  $("logout").onclick = logout;

  const show = () => {
    const t = document.documentElement.dataset.theme ?? "system";
    [...$("theme").children].forEach((b, i) => {
      b.ariaPressed = String(b.dataset.t === t);
      if (b.dataset.t === t) $("theme").style.setProperty("--i", String(i));
    });
  };
  $("theme").onclick = (e) => {
    const t = e.target.closest("button")?.dataset.t;
    if (!t) return;
    window.setTheme(t);
    show();
  };
  show();

  const [data, ok] = await api("/api/me");
  if (!ok) toLogin();
  else {
    $("who").textContent = `Logged in as ${data.me.name} (${data.me.email}).`;
    $("showTraining").checked = !!data.me.show_training;
    $("showTraining").onchange = async (e) => {
      const box = e.target;
      const [, saved] = await api("/api/me/training", { show: box.checked });
      if (!saved) box.checked = !box.checked;
    };
  }
</script>
</body>
</html>
