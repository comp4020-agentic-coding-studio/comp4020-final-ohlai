<!doctype html>
<html lang="en-AU" data-style="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Program</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body data-default-view="mobile">
<main>
  <section id="workout">
    <div class="topbar">
      <h1 id="title">Loading…</h1>
      <div class="day-actions" id="dayActions"></div>
    </div>
    <p class="sub" id="sub"></p>
    <div class="stats" id="stats"></div>
    <div class="exercises" id="list"></div>
  </section>

  <section id="summary" hidden>
    <div class="topbar">
      <button type="button" class="back" id="back" aria-label="Back to workout"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
      <h1 id="sumTitle"></h1>
    </div>
    <div id="sumBody"></div>
  </section>
  <p id="err" class="error" role="alert"></p>
</main>

<div class="restbar" id="rest" hidden>
  <div class="restprog"><div id="restFill"></div></div>
  <div class="restrow">
    <button type="button" id="restMinus">-15</button>
    <output id="restTime" aria-live="off">0:00</output>
    <button type="button" id="restPlus">+15</button>
    <button type="button" class="primary" id="restSkip">Skip</button>
  </div>
</div>

<!-- Chat with the other person on the program, without leaving it. -->
<button type="button" class="chatfab" id="chatFab" hidden aria-label="Messages" aria-haspopup="dialog">
  <span aria-hidden="true" class="ico"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M12.5 20.5A8.5 8.5 0 1 0 4.8 15.6L3.6 18.6Q3.1 20.5 5 20.5ZM9.7 9.3h1.6a.8.8 0 0 1 0 1.6H9.7a.8.8 0 0 1 0-1.6ZM9.7 12.6h4.9a.8.8 0 0 1 0 1.6H9.7a.8.8 0 0 1 0-1.6Z"/></svg></span><span class="dot" id="chatDot" hidden></span>
</button>
<dialog id="chatDrawer" class="drawer" aria-labelledby="chatTitle">
  <div class="drawer-head">
    <h2 id="chatTitle">Messages</h2>
    <button type="button" id="chatClose" aria-label="Close messages">✕</button>
  </div>
  <div id="chatBody" class="drawer-body"></div>
</dialog>

<script src="/view.js"></script>
<script type="module">
  import { workouts as allWorkouts, exHistory as history_, liftSummary } from "/lift-chart.js";
  import { api as getJson, toLogin, live, ask } from "/ui.js";
  import { mountChat } from "/chat.js";
  // The client's workout in progress, and nothing else. Starting a day happens
  // on /me; the PT follows a client from the dashboard's client card.
  const tok = location.pathname.split("/").pop();
  let state;
  const drafts = {};   // typed-but-unlogged values, kept across re-renders
  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, ...kids) {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...kids);
    return n;
  }

  const utc = (t) => new Date(t + "Z");
  const kg = (w) => (w == null ? "–" : `${+w}kg`);
  const vol = (logs) => logs.reduce((s, l) => s + (l.weight ?? 0) * l.reps, 0);
  const rowCount = {}; // rows shown per exercise in the open workout, after adds and removals

  const workouts = () => allWorkouts(state);
  const exHistory = (exId) => history_(state, exId);

  async function api(path, body) {
    const res = await fetch(path, body && { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { $("err").textContent = data.error; return null; }
    $("err").textContent = "";
    return data;
  }
  async function act(what, body = {}) {
    const data = await api(`/api/p/${tok}/${what}`, body);
    if (data) { state = data; route(); }
    return data;
  }

  async function load() {
    const data = await api(`/api/p/${tok}`);
    if (!data) return ($("title").textContent = "Program not found");
    // A PT token has no page here any more: the PT works from the dashboard.
    if (data.role === "pt") return location.replace("/dash");
    // With no workout open, the client's place is their dashboard, where they pick a day.
    if (!data.open_session) return location.replace("/me");
    state = data;
    route();
    setupChat();
  }

  // The chat drawer with their PT: a button bottom left.
  let chat;
  async function setupChat() {
    const { claimed, program } = state;
    const other = claimed ? program.pt_user_id : null;
    $("chatFab").hidden = !other;
    if (!other || chat) return;
    $("chatTitle").textContent = program.pt_name;
    chat = mountChat($("chatBody"), other, {
      onLoad: (data) => data || $("chatBody").replaceChildren(el("p", { className: "muted pad" }, "Log in to send messages. ",
        el("button", { type: "button", textContent: "Log in", onclick: toLogin }))),
    });
    const [me, loggedIn] = await getJson("/api/me");
    if (!loggedIn) return;
    if (me.pts?.some((p) => p.id === other && p.unread)) $("chatDot").hidden = false;
    live("/api/events", (e) => {
      if (e.type !== "chat") return;
      if ($("chatDrawer").open) chat.load();
      else $("chatDot").hidden = false;
    });
  }
  $("chatFab").onclick = () => {
    $("chatDrawer").showModal();
    $("chatDot").hidden = true;
    chat.load();
  };
  $("chatClose").onclick = () => $("chatDrawer").close();
  // Tapping the dimmed page above the drawer closes it. A braced body, not
  // `a && b`: an onclick that returns false cancels the click, which stopped
  // the Send button working.
  $("chatDrawer").onclick = (e) => { if (e.target === $("chatDrawer")) $("chatDrawer").close(); };

  function route() {
    const id = Number(location.hash.match(/^#ex-(\d+)$/)?.[1]);
    const ex = state.exercises.find((e) => e.id === id);
    $("workout").hidden = !!ex;
    $("summary").hidden = !ex;
    ex ? renderSummary(ex) : renderWorkout();
  }
  addEventListener("hashchange", route);
  $("back").onclick = () => (history.length > 1 ? history.back() : (location.hash = ""));

  const stat = ([k, v]) => el("div", {}, el("small", { textContent: k }), el("strong", { textContent: v }));
  let durationTick;

  function renderWorkout() {
    const { program, exercises } = state;
    const open = state.open_session;
    document.title = program.title;
    clearInterval(durationTick);
    $("title").textContent = open.day;
    $("sub").textContent = `${program.title}, from ${program.pt_name}. Tick each set as you finish it.`;
    // Small, on the day's name line, so they don't take a row of their own.
    $("dayActions").replaceChildren(
      el("button", { type: "button", className: "small", textContent: "Discard", onclick: async () => { if (await ask("Discard this workout?", "Its sets go too.", "Discard")) discard(); } }),
      el("button", { type: "button", className: "small primary", textContent: "Finish", onclick: finish }));
    const cur = workouts().find((w) => w.id === open.id)?.logs ?? [];
    const drawStats = () => $("stats").replaceChildren(...[
      ["Duration", `${Math.max(0, Math.floor((Date.now() - utc(open.started_at)) / 60000))} min`],
      ["Volume", `${+vol(cur).toFixed(1)} kg`], ["Sets", cur.length]].map(stat));
    drawStats();
    durationTick = setInterval(drawStats, 30000);
    $("list").replaceChildren(...exercises.filter((e) => e.day === open.day).map(exerciseCard));
  }

  // Discard and Finish end the workout, so the page has nothing left to show.
  // Straight to the dashboard without re-rendering, so nothing flashes first.
  // Every client has an account (they join through an invite), so /me is there.
  async function endWorkout(what) {
    if (await api(`/api/p/${tok}/${what}`, {})) location.replace("/me");
  }
  const discard = () => endWorkout("discard");

  async function finish() {
    const open = state.open_session;
    const n = state.logs.filter((l) => l.session_id === open.id).length;
    if (!(await ask(`Finish ${open.day}?`, n ? `${n} set${n > 1 ? "s" : ""} will be saved.` : "No sets logged, so this workout gets thrown away.", "Finish"))) return;
    endWorkout("finish");
  }

  function exerciseCard(ex) {
    const hist = exHistory(ex.id);
    const open = state.open_session;
    const curIdx = hist.findIndex((h) => h.w.id === open.id);
    const current = hist[curIdx]?.sets ?? {};
    const earlier = (curIdx === -1 ? hist : hist.slice(0, curIdx)).slice().reverse();
    const prev = (n) => earlier.map((h) => h.sets[n]).find(Boolean);
    const maxLogged = Math.max(0, ...Object.keys(current).map(Number));
    const count = Math.max(rowCount[ex.id] ?? ex.sets, maxLogged);

    const rows = [];
    for (let n = 1; n <= count; n++) {
      const done = current[n], p = prev(n), key = `${ex.id}:${n}`;
      const d = drafts[key] ?? {};
      const target = parseInt(ex.reps) || "";
      const wIn = el("input", { type: "number", inputMode: "decimal", step: "0.25", min: 0, ariaLabel: `Set ${n} kg`,
        value: done ? (done.weight ?? "") : (d.w ?? ""), placeholder: p?.weight ?? "", disabled: !!done,
        oninput: (e) => ((drafts[key] ??= {}).w = e.target.value) });
      const rIn = el("input", { type: "number", inputMode: "numeric", min: 0, ariaLabel: `Set ${n} reps`,
        value: done ? done.reps : (d.r ?? ""), placeholder: p?.reps ?? target, disabled: !!done,
        oninput: (e) => ((drafts[key] ??= {}).r = e.target.value) });
      const tick = el("button", { type: "button", className: "tick", textContent: "✓", ariaPressed: String(!!done),
        ariaLabel: done ? `Untick set ${n}` : `Tick set ${n} done`,
        onclick: () => (done ? act("unlog", { id: done.id }) : tickSet(ex, n, wIn.value || wIn.placeholder, rIn.value || rIn.placeholder)) });
      const row = el("div", { className: "set" + (done ? " done" : "") },
        el("span", { className: "setno", textContent: n }),
        el("span", { className: "prev", textContent: p ? `${kg(p.weight)}×${p.reps}` : "–" }),
        wIn, rIn, tick);
      rows.push(swipeable(row, n, () => removeSet(ex, n, count)));
    }

    const rest = ex.rest_seconds;
    return el("article", { className: "card" },
      el("div", { className: "ex-head" },
        el("a", { href: `#ex-${ex.id}`, className: "ex-name", textContent: ex.name }),
        el("span", { className: "muted", textContent: `${ex.sets} × ${ex.reps}` })),
      ex.notes ? el("p", { className: "notes", textContent: ex.notes }) : "",
      el("p", { className: "rest-label", textContent: `⏱ Rest Timer: ${Math.floor(rest / 60)}min ${rest % 60}s` }),
      el("div", { className: "sets" },
        el("div", { className: "set head" }, ...["Set", "Previous", "kg", "Reps", "✓"].map((t) => el("span", { textContent: t }))),
        ...rows),
      el("button", { type: "button", className: "addset", textContent: "+ Add Set",
        onclick: () => { rowCount[ex.id] = count + 1; renderWorkout(); } }));
  }

  // Swipe a row left to reveal Delete, or keep going to delete straight away.
  // The button stays in the tab order, so a keyboard reaches it without a swipe.
  function swipeable(row, n, onDelete) {
    const del = el("button", { type: "button", className: "del", textContent: "Delete", ariaLabel: `Delete set ${n}`, onclick: onDelete });
    const wrap = el("div", { className: "swipe" }, del, row);
    const OPEN = -88;
    let x0 = null, y0, dx = 0, dragging = false;
    const slide = (x, anim) => {
      row.style.transition = anim ? "transform .18s" : "none";
      row.style.transform = x ? `translateX(${x}px)` : "";
    };
    row.addEventListener("pointerdown", (e) => {
      if (e.target.closest("input, button")) return;
      x0 = e.clientX; y0 = e.clientY; dragging = null;
    });
    row.addEventListener("pointermove", (e) => {
      if (x0 === null) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (dragging === null && Math.abs(mx) + Math.abs(my) > 8) dragging = Math.abs(mx) > Math.abs(my);
      if (!dragging) return;
      wrap.classList.add("drag");
      row.setPointerCapture(e.pointerId);
      dx = Math.min(0, mx + (wrap.classList.contains("open") ? OPEN : 0));
      slide(dx);
    });
    const end = () => {
      if (dragging) {
        if (dx < -wrap.offsetWidth * 0.6) return onDelete();
        const open = dx < OPEN / 2;
        wrap.classList.toggle("open", open);
        slide(open ? OPEN : 0, true);
      }
      wrap.classList.remove("drag");
      x0 = null; dragging = false; dx = 0;
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", end);
    del.addEventListener("focus", () => { wrap.classList.add("open"); slide(OPEN, true); });
    del.addEventListener("blur", () => { wrap.classList.remove("open"); slide(0, true); });
    return wrap;
  }

  async function removeSet(ex, n, count) {
    // Typed values in the rows below move up with them.
    for (let i = n; i < count; i++) drafts[`${ex.id}:${i}`] = drafts[`${ex.id}:${i + 1}`];
    delete drafts[`${ex.id}:${count}`];
    rowCount[ex.id] = count - 1;
    await act("remove", { exercise_id: ex.id, set_no: n });
  }

  async function tickSet(ex, set_no, weight, reps) {
    if (!(await act("log", { exercise_id: ex.id, set_no, reps: parseInt(reps) || 0, weight }))) return;
    delete drafts[`${ex.id}:${set_no}`];
    if (ex.rest_seconds) startRest(ex.rest_seconds);
  }

  // Rest timer: a deadline, so it stays right if the phone sleeps.
  let restEnd = 0, restTotal = 0, restTick;
  function startRest(s) {
    restTotal = s; restEnd = Date.now() + s * 1000;
    $("rest").hidden = false;
    clearInterval(restTick);
    restTick = setInterval(drawRest, 250);
    drawRest();
  }
  function drawRest() {
    const left = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
    $("restTime").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    $("restFill").style.width = `${(left / restTotal) * 100}%`;
    if (!left) { clearInterval(restTick); $("rest").hidden = true; navigator.vibrate?.(300); }
  }
  $("restMinus").onclick = () => { restEnd -= 15000; drawRest(); };
  $("restPlus").onclick = () => { restEnd += 15000; restTotal += 15; drawRest(); };
  $("restSkip").onclick = () => { restEnd = 0; drawRest(); };

  // Exercise summary: a chart over sessions and records (public/lift-chart.js,
  // shared with the PT dashboard).
  function renderSummary(ex) {
    $("sumTitle").textContent = ex.name;
    document.title = ex.name;
    $("sumBody").replaceChildren(liftSummary(ex, exHistory(ex.id)));
  }

  load();
</script>
</body>
</html>
